name: Build & Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

      - name: Publish
        run: dotnet publish src/THWTicketApp.Web/THWTicketApp.Web.csproj --configuration Release --output publish

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: blazor-publish
          path: publish/wwwroot
          retention-days: 7

  code-quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Check formatting
        run: dotnet format --verify-no-changes --verbosity diagnostic || echo "::warning::Code formatting issues found. Run 'dotnet format' locally."

      - name: Check for vulnerable packages
        # Human-readable report for the log/artifact; the JSON variant is what
        # gates the build (the text form exits 0 even when it lists findings).
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vulnerability-report.txt
          dotnet list package --vulnerable --include-transitive --format json > vulnerability-report.json
          if grep -q '"vulnerabilities"' vulnerability-report.json; then
            echo "::error::Vulnerable NuGet packages found - see the log above or the vulnerability-report artifact."
            exit 1
          fi

      - name: Upload vulnerability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vulnerability-report
          path: |
            vulnerability-report.txt
            vulnerability-report.json
          retention-days: 30
